name: Dehumidifier
products:
  - id: eguoms25tkxtf5u8
    manufacturer: Arida
    model: Stavern
    model_id: DDS032FX-BEW
entities:
  - entity: humidifier
    class: dehumidifier
    translation_only_key: extended
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: humidity
        range:
          min: 40
          max: 60
        mapping:
          - dps_val: "40"
            value: 40
            step: 10
          - dps_val: "50"
            value: 50
            step: 10
          - dps_val: "60"
            value: 60
            step: 10
      - id: 4
        type: string
        name: mode
        mapping:
          - dps_val: LOW
            value: low
          - dps_val: HIGH
            value: high
      - id: 6
        type: integer
        name: current_humidity
      - id: 19
        type: bitfield
        name: action
        mapping:
          # E_Saving (bit 2) is set while the unit is not dehumidifying.
          - dps_val: 4
            value: idle
          - value: drying
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: CANCEL
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
          - dps_val: "10h"
            value: "10h"
          - dps_val: "11h"
            value: "11h"
          - dps_val: "12h"
            value: "12h"
  - entity: binary_sensor
    translation_key: tank_full
    dps:
      # bit 3 (FULL) of the fault bitfield
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 8
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      # Fault bits: 1 = TILTED, 2 = CHECK, 4 = E_Saving, 8 = FULL.
      # Only TILTED and CHECK are real problems.  E_Saving reports the
      # unit not dehumidifying, and is used as the humidifier action.
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 3
            value: true
          - value: false
      - id: 19
        type: bitfield
        name: fault_code
      - id: 19
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: tilted
          - dps_val: 2
            value: service_required
          - dps_val: 4
            value: idle
          - dps_val: 8
            value: tank_full
