name: Dehumidifier
products:
  - id: dfgvbaiibilmpfkx
    manufacturer: Arida
    model: Pro S13
    model_id: EDS122X-BE/BE2
entities:
  - entity: humidifier
    class: dehumidifier
    translation_only_key: extended
    dps:
      - id: 1
        type: boolean
        name: switch
        # Not returned in the local status poll, only sent on change.
        optional: true
      - id: 103
        type: string
        name: humidity
        range:
          min: 0
          max: 80
        mapping:
          # "continuous" runs without a humidity target.  HA has no
          # concept for that, so it is represented as 0.  Values in
          # between snap to the nearest mapped setting.
          - dps_val: continuous
            value: 0
            step: 5
          - dps_val: "30"
            value: 30
            step: 5
          - dps_val: "35"
            value: 35
            step: 5
          - dps_val: "40"
            value: 40
            step: 5
          - dps_val: "45"
            value: 45
            step: 5
          - dps_val: "50"
            value: 50
            step: 5
          - dps_val: "55"
            value: 55
            step: 5
          - dps_val: "60"
            value: 60
            step: 5
          - dps_val: "65"
            value: 65
            step: 5
          - dps_val: "70"
            value: 70
            step: 5
          - dps_val: "75"
            value: 75
            step: 5
          - dps_val: "80"
            value: 80
            step: 5
      - id: 5
        type: string
        name: mode
        mapping:
          - dps_val: Auto
            value: auto
          - dps_val: Normal
            value: normal
          - dps_val: Boost
            value: boost
          - dps_val: Ventilation
            value: ventilation
          - dps_val: Winter
            value: winter
          - dps_val: AntiMold
            value: anti_mold
      - id: 6
        type: integer
        name: current_humidity
      - id: 19
        type: bitfield
        name: action
        mapping:
          # AUTOPAUSE (bit 0) is set while the unit is not dehumidifying.
          - dps_val: 1
            value: idle
          - value: drying
  - entity: select
    name: Fan speed
    translation_key: mode
    icon: "mdi:fan"
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: Low
            value: low
          - dps_val: Medium
            value: medium
          - dps_val: High
            value: high
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: select
    name: Humidity source
    icon: "mdi:access-point"
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: In
            value: Remote
          - dps_val: Out
            value: Unit
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
          - dps_val: "10h"
            value: "10h"
          - dps_val: "11h"
            value: "11h"
          - dps_val: "12h"
            value: "12h"
          - dps_val: "13h"
            value: "13h"
          - dps_val: "14h"
            value: "14h"
          - dps_val: "15h"
            value: "15h"
          - dps_val: "16h"
            value: "16h"
          - dps_val: "17h"
            value: "17h"
          - dps_val: "18h"
            value: "18h"
          - dps_val: "19h"
            value: "19h"
          - dps_val: "20h"
            value: "20h"
          - dps_val: "21h"
            value: "21h"
          - dps_val: "22h"
            value: "22h"
          - dps_val: "23h"
            value: "23h"
          - dps_val: "1d"
            value: "1d"
          - dps_val: "2d"
            value: "2d"
          - dps_val: "3d"
            value: "3d"
          - dps_val: "4d"
            value: "4d"
          - dps_val: "5d"
            value: "5d"
          - dps_val: "6d"
            value: "6d"
          - dps_val: "7d"
            value: "7d"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      # Fault bits: 1 = AUTOPAUSE, 2 = CHECK.  Auto pause is a normal
      # operating state reporting that the unit is not dehumidifying,
      # so it is used as the humidifier action rather than a fault.
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 2
            value: true
          - value: false
      - id: 19
        type: bitfield
        name: fault_code
      - id: 19
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 2
            value: service_required
          - dps_val: 1
            value: idle
